      // Polyfill to prevent SecurityError when localStorage or sessionStorage are blocked in sandboxed iframes
      (function() {
        try {
          var test = window.localStorage;
        } catch (e) {
          function createMockStorage() {
            var store = {};
            return {
              getItem: function(key) { return store.hasOwnProperty(key) ? store[key] : null; },
              setItem: function(key, value) { store[key] = String(value); },
              removeItem: function(key) { delete store[key]; },
              clear: function() { store = {}; },
              key: function(index) { return Object.keys(store)[index] || null; },
              get length() { return Object.keys(store).length; }
            };
          }
          try {
            Object.defineProperty(window, 'localStorage', { value: createMockStorage(), configurable: true });
          } catch(err) {}
        }
        try {
          var test2 = window.sessionStorage;
        } catch (e) {
          function createMockStorage() {
            var store = {};
            return {
              getItem: function(key) { return store.hasOwnProperty(key) ? store[key] : null; },
              setItem: function(key, value) { store[key] = String(value); },
              removeItem: function(key) { delete store[key]; },
              clear: function() { store = {}; },
              key: function(index) { return Object.keys(store)[index] || null; },
              get length() { return Object.keys(store).length; }
            };
          }
          try {
            Object.defineProperty(window, 'sessionStorage', { value: createMockStorage(), configurable: true });
          } catch(err) {}
        }
      })();

      // Global Ad-Shield & Popup Blocker to protect user from 3rd-party embed redirections
      (function() {
        try {
          var originalOpen = window.open;
          window.open = function(url, target, features) {
            if (!url) return null;
            var strUrl = String(url).toLowerCase();
            var allowed = ["mega-anime.com", "megaanime.net", "firebaseapp.com", "web.app", "localhost", "127.0.0.1"];
            var isAllowed = allowed.some(function(domain) { return strUrl.indexOf(domain) !== -1; });
            if (!isAllowed && (strUrl.indexOf("http://") === 0 || strUrl.indexOf("https://") === 0 || strUrl.indexOf("//") === 0)) {
              console.warn("[Ad-Shield] Blocked popup window to external ad URL:", url);
              return null;
            }
            return originalOpen.call(window, url, target, features);
          };
        } catch(e) {}
      })();
    </script>
